name: brew pr-pull
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number with successful bottle builds
        required: true
        type: string
      head_sha:
        description: Reviewed pull request head commit SHA
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  pr-pull:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: write
      id-token: write
      issues: read
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1

      - name: Pull bottles
        id: pull_bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          [[ "$PULL_REQUEST" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          [[ "$GITHUB_REF_TYPE" == branch && "$GITHUB_REF_NAME" != main ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]] || exit 1
          # setup-homebrew checks out the workflow SHA on a local default branch.
          git checkout -B "$GITHUB_REF_NAME" "$HEAD_SHA"
          brew pr-pull --debug --retain-bottle-dir --tap="$GITHUB_REPOSITORY" \
            --no-cherry-pick --clean --branch-okay \
            --head-sha="$HEAD_SHA" "$PULL_REQUEST"

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ steps.pull_bottles.outputs.bottle_path }}/*.tar.gz"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          branch: ${{ github.ref_name }}
