name: brew test-bot
on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        include:
          - os: ubuntu-24.04
            container:
              image: ghcr.io/homebrew/brew:latest
              options: --privileged
          - os: ubuntu-24.04-arm
            container:
              image: ghcr.io/homebrew/brew:latest
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Build Ghidra on Intel macOS
        if: github.event_name == 'pull_request' && matrix.os == 'macos-15-intel'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- Formula/ghidra@12.1.rb; then
            exit 0
          fi
          # test-bot skips formulae whose dependencies have no compatible bottles.
          formula=kurefm/tap/ghidra@12.1
          brew install --only-dependencies "$formula"
          brew install --build-bottle "$formula"
          brew test "$formula"
          pkg_version=$(brew list --versions "$formula" | awk '{print $2}')
          brew bottle --json \
            --root-url="https://github.com/$GITHUB_REPOSITORY/releases/download/ghidra@12.1-$pkg_version" \
            "$formula"

      - name: Verify Ghidra bottle artifacts
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- Formula/ghidra@12.1.rb; then
            exit 0
          fi
          compgen -G 'ghidra@12.1--*.bottle*.tar.gz' || exit 1
          compgen -G 'ghidra@12.1--*.bottle.json' || exit 1

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
